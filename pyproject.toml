[project]
name = "ollama-gateway"
version = "0.1.0"
description = "API compatible con OpenAI sobre Ollama (qwen2.5:3b), en Clean Architecture"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
