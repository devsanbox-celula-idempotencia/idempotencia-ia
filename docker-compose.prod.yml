# =============================================================================
#  PRODUCCIÓN
#
#  Asume que Ollama corre nativo en el host (con systemd) y que SQL Server es
#  externo. Solo la API va en contenedor.
#
#     docker compose -f docker-compose.prod.yml up -d --build
#     docker compose -f docker-compose.prod.yml logs -f api
#
#  Nginx en el host hace de proxy hacia 127.0.0.1:8000. Ver docs/runbook-devops.md.
#
#  Por qué Ollama NO va aquí: en un servidor sin GPU, meterlo en un contenedor
#  solo añade una capa sobre un proceso que ya es intensivo en memoria, y
#  complica el acceso a la GPU si algún día la hay.
# =============================================================================
name: ollama-gateway-prod

services:
  api:
    build: .
    image: ollama-gateway:${VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "100.99.206.50:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - red-proxy

networks:
  red-proxy:
    external: true

  # Descomenta si necesitas rate limiting compartido entre varios workers o
  # varias instancias (RATE_LIMIT_BACKEND=redis en el .env).
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
  #   mem_limit: 128m
  #   logging:
  #     driver: json-file
  #     options: {max-size: "10m", max-file: "3"}
